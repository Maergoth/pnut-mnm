name: Windows regression and portable release gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONFAULTHANDLER: '1'
      PNUT_NATIVE_UI_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install tested runtime and build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Verify Evergreen WebView2 runtime for native browser gates
        # CI prerequisite only: the desktop app never installs a runtime silently.
        # Microsoft documents these per-machine/per-user keys and /silent /install:
        # https://learn.microsoft.com/microsoft-edge/webview2/concepts/distribution
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-WebView2Version {
            $runtimeKeys = @(
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
              'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            )
            foreach ($runtimeKey in $runtimeKeys) {
              $candidate = Get-ItemPropertyValue -LiteralPath $runtimeKey -Name pv -ErrorAction SilentlyContinue
              $parsedVersion = $null
              if ([version]::TryParse([string]$candidate, [ref]$parsedVersion) -and $parsedVersion -gt [version]'0.0.0.0') {
                return $parsedVersion.ToString()
              }
            }
            return $null
          }
          $runtimeVersion = Get-WebView2Version
          if (-not $runtimeVersion) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper -TimeoutSec 60 -MaximumRedirection 5
            if ((Get-Item -LiteralPath $bootstrapper).Length -gt 8MB) { throw 'Unexpected WebView2 bootstrapper size' }
            $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation(?:,|$)') {
              throw 'The WebView2 bootstrapper does not have a valid Microsoft signature'
            }
            $installer = Start-Process -FilePath $bootstrapper -ArgumentList @('/silent', '/install') -PassThru -WindowStyle Hidden
            if (-not $installer.WaitForExit(180000)) {
              Stop-Process -Id $installer.Id -Force -ErrorAction SilentlyContinue
              throw 'The CI WebView2 installation exceeded three minutes'
            }
            if ($installer.ExitCode -notin @(0, 3010)) { throw "WebView2 installer failed ($($installer.ExitCode))" }
            for ($attempt = 0; $attempt -lt 15 -and -not $runtimeVersion; $attempt++) {
              $runtimeVersion = Get-WebView2Version
              if (-not $runtimeVersion) { Start-Sleep -Seconds 2 }
            }
          }
          if (-not $runtimeVersion) { throw 'Evergreen WebView2 runtime was not detected after installation' }
          Write-Host "Evergreen WebView2 runtime: $runtimeVersion"
      - name: Build native adapter for source regression checks
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe scripts/build_atlas_webview.py
          if ($LASTEXITCODE -ne 0) { throw 'Native adapter compilation failed' }
      - name: Run regression suite without game capture
        # Regressions gate the PR; release runs verify the merged executable
        # and portable package without repeating the full test suite.
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Regression suite failed (Python exit code $LASTEXITCODE)" }
      - name: Run leaderboard Worker conformance tests
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          node --test leaderboard_worker/test/worker.test.js
          if ($LASTEXITCODE -ne 0) { throw "Worker conformance tests failed (Node exit code $LASTEXITCODE)" }
      - name: Clean frozen build and embedded provenance/startup gate
        shell: pwsh
        run: ./build_exe.ps1 -Clean
      - name: Extracted ZIP startup, version, checksum and layout gate
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe scripts/package_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Extracted portable release gate failed' }
      - name: Preserve build diagnostics and verified portable artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-gates
          path: |
            build/startup-smoke-*.json
            build/build-info.json
            dist/releases/*
          if-no-files-found: warn
  release:
    # Publishes v<__version__> with the gated ZIP and checksum when that release
    # does not exist yet, so merging a version bump to main ships the release the
    # in-app updater looks for. Pushes without a version bump publish nothing, and
    # a dispatch repairs a release that is missing assets or stuck as a draft.
    needs: windows
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified portable artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-portable-gates
      - name: Publish the release with its Windows package and checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/releases/PNUT-MnM-*-windows.zip)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one verified release ZIP, found ${#archives[@]}" >&2
            exit 1
          fi
          archive=${archives[0]}
          checksum="$archive.sha256"
          name=$(basename "$archive")
          version=${name#PNUT-MnM-}
          version=${version%-windows.zip}
          tag="v$version"
          (cd dist/releases && sha256sum --check --strict "$name.sha256")
          if view=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,isDraft 2>/dev/null); then
            missing=$(jq -r --arg zip "$name" '[$zip, $zip + ".sha256"] - [.assets[].name] | length' <<<"$view")
            if [ "$missing" != 0 ]; then
              echo "Release $tag exists without its verified package; attaching this run's assets."
              gh release upload "$tag" "$archive" "$checksum" --repo "$GITHUB_REPOSITORY" --clobber
            else
              echo "Release $tag already carries $name and its checksum."
            fi
            if [ "$(jq -r .isDraft <<<"$view")" = true ]; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
            fi
          else
            # Draft first so releases/latest never serves a release whose assets
            # are still uploading: the updater rejects a package-less release.
            gh release create "$tag" "$archive" "$checksum" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "PNUT M&M $version" --generate-notes --draft
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
            echo "Published $tag with $name and its checksum."
          fi
